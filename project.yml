name: DestinationArrival
options:
  bundleIdPrefix: io.github.ardakaan78715
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  ArrivalKit:
    path: Packages/ArrivalKit
targets:
  DestinationArrival:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ArrivalKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ardakaan78715.DestinationArrival
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Destination Arrival
        NSLocationWhenInUseUsageDescription: Destination Arrival uses your location during a journey to work out when you are nearly there and wake you in time.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
schemes:
  DestinationArrival:
    build:
      targets:
        DestinationArrival: all
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: London, England
    test:
      config: Debug
      targets:
        - package: ArrivalKit/ArrivalKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
