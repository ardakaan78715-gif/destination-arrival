name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  arrivalkit:
    name: ArrivalKit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show the Swift version
        run: swift --version
      - name: Run the package tests
        run: swift test --package-path Packages/ArrivalKit

  app:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Build the app without signing
        run: xcodebuild -project DestinationArrival.xcodeproj -scheme DestinationArrival -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
